# CI の基本のジョブ（docs/exec-plans/skeleton-and-ci.md の「4. CI」）。
# ジョブ名は main ブランチの保護で「必須のステータスチェック」に指定する。名前を変えるときは保護の設定も直す。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 公開リポジトリなので権限は最小限にする。AWS の認証や書き込みの権限はこのワークフローでは使わない
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: ESLint（不変条件の lint を含む）
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  deps:
    name: deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 依存の方向（INV-5）
        run: pnpm deps

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 単体テスト
        run: pnpm test

  spec-coverage:
    name: spec-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 仕様の例の節がテストにあるか（TESTING.md）
        run: pnpm spec-coverage

  test-tamper:
    name: test-tamper
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: 自律度「中」のテストと実装の同時変更がないか（TESTING.md）
        run: pnpm test-tamper --base "origin/${{ github.base_ref }}"

  test-int:
    name: test-int
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: ローカルの DynamoDB を起動（compose.yaml）
        run: pnpm db:up
      - name: 統合テスト
        run: pnpm test:int

  expected-failures:
    name: expected-failures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: ローカルの DynamoDB を起動（統合テストが失敗予定リストにある場合のため）
        run: pnpm db:up
      - name: 失敗予定リストのテストが、まだ失敗するか（TESTING.md）
        run: pnpm expected-failures
